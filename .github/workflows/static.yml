            {subtitle_html}
        </div>
        """,
        unsafe_allow_html=True,
    )

# --- CONEXÃO E CRIAÇÃO DO BANCO DE DADOS ---
DB_NAME = "remedios.db"

def init_db():
    conn = sqlite3.connect(DB_NAME)
    c = conn.cursor()
    # Tabela de Usuários
    c.execute('''
        CREATE TABLE IF NOT EXISTS usuarios (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            username TEXT UNIQUE NOT NULL,
            password TEXT NOT NULL,
            whatsapp TEXT
        )
    ''')
    # Tabela de Remédios
    c.execute('''
        CREATE TABLE IF NOT EXISTS remedios (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            user_id INTEGER NOT NULL,
            nome TEXT NOT NULL,
            qtd_atual INTEGER NOT NULL,
            qtd_total INTEGER NOT NULL,
            data_vencimento TEXT NOT NULL,
            FOREIGN KEY (user_id) REFERENCES usuarios (id)
        )
    ''')
    conn.commit()
    conn.close()

def make_hashes(password):
    return hashlib.sha256(str.encode(password)).hexdigest()

def check_hashes(password, hashed_text):
    if make_hashes(password) == hashed_text:
        return hashed_text
    return False

init_db()

# --- SESSÃO DO USUÁRIO ---
if "logged_in" not in st.session_state:
    st.session_state["logged_in"] = False
if "user_id" not in st.session_state:
    st.session_state["user_id"] = None
if "username" not in st.session_state:
    st.session_state["username"] = ""
if "theme" not in st.session_state:
    st.session_state["theme"] = "light"

# --- TELA DE LOGIN / CADASTRO ---
def login_screen():
    aplicar_estilo()
    render_header("💊 Sistema de Controle de Remédios", "Gestão moderna do seu estoque e vencimento")

    menu = ["Login", "Cadastrar-se"]
    choice = st.sidebar.selectbox("Menu", menu)

    if choice == "Login":
        st.subheader("Acesse sua Conta")
        username = st.text_input("Usuário")
        password = st.text_input("Senha", type="password")
        
        if st.button("Entrar"):
            hashed_pswd = make_hashes(password)
            conn = sqlite3.connect(DB_NAME)
            c = conn.cursor()
            c.execute('SELECT id, password FROM usuarios WHERE username = ?', (username,))
            data = c.fetchone()
            conn.close()
            
            if data and check_hashes(password, data[1]):
                st.session_state["logged_in"] = True
                st.session_state["user_id"] = data[0]
                st.session_state["username"] = username
                st.success(f"Bem-vindo(a), {username}!")
                st.rerun()
            else:
                st.error("Usuário ou senha incorretos.")

    elif choice == "Cadastrar-se":
        st.subheader("Criar Nova Conta")
        new_user = st.text_input("Nome de Usuário")
        new_password = st.text_input("Senha", type="password")
        whatsapp = st.text_input("Número do WhatsApp (Ex: 5511999999999)")

        if st.button("Cadastrar"):
            if new_user and new_password:
                try:
                    conn = sqlite3.connect(DB_NAME)
                    c = conn.cursor()
                    c.execute('INSERT INTO usuarios(username, password, whatsapp) VALUES (?,?,?)',
                              (new_user, make_hashes(new_password), whatsapp))
                    conn.commit()
                    conn.close()
                    st.success("Conta criada com sucesso! Faça login para continuar.")
                except sqlite3.IntegrityError:
                    st.error("Este nome de usuário já existe.")
            else:
                st.warning("Preencha todos os campos obrigatórios.")

# --- TELA PRINCIPAL (DASHBOARD) ---
def main_screen():
    aplicar_estilo()
    st.sidebar.title(f"👤 {st.session_state['username']}")
    st.session_state["theme"] = "dark" if st.sidebar.toggle("Modo escuro", value=(st.session_state["theme"] == "dark")) else "light"
    if st.sidebar.button("Sair"):
        st.session_state["logged_in"] = False
        st.session_state["user_id"] = None
        st.session_state["username"] = ""
        st.rerun()

    render_header("📦 Meu Estoque de Remédios", "Visão geral, alertas e controle de validade")

    # --- ABA DE ADIÇÃO DE REMÉDIOS ---
    with st.expander("➕ Adicionar Novo Remédio"):
        with st.form("form_remedio", clear_on_submit=True):
            nome = st.text_input("Nome do Remédio")
            col1, col2 = st.columns(2)
            qtd_atual = col1.number_input("Quantidade Atual", min_value=0, value=10)
            qtd_total = col2.number_input("Quantidade Total/Inicial", min_value=1, value=30)
            data_venc = st.date_input("Data de Vencimento", min_value=datetime.today())
            
            submitted = st.form_submit_button("Salvar Remédio")
            if submitted:
                if nome:
                    conn = sqlite3.connect(DB_NAME)
                    c = conn.cursor()
                    c.execute('''
                        INSERT INTO remedios (user_id, nome, qtd_atual, qtd_total, data_vencimento)
                        VALUES (?, ?, ?, ?, ?)
                    ''', (st.session_state["user_id"], nome, qtd_atual, qtd_total, str(data_venc)))
                    conn.commit()
                    conn.close()
                    st.success(f"Remédio '{nome}' cadastrado!")
                    st.rerun()
                else:
                    st.error("Insira o nome do remédio.")

    # --- CONSULTA AO BANCO DE DADOS ---
    conn = sqlite3.connect(DB_NAME)
    c = conn.cursor()
    c.execute('SELECT id, nome, qtd_atual, qtd_total, data_vencimento FROM remedios WHERE user_id = ?', 
              (st.session_state["user_id"],))
    remedios = c.fetchall()
    conn.close()

    if not remedios:
        st.info("Nenhum remédio cadastrado no momento.")
        return

    df = pd.DataFrame(remedios, columns=["id", "nome", "qtd_atual", "qtd_total", "data_vencimento"])
    df["percentual_estoque"] = (df["qtd_atual"] / df["qtd_total"] * 100).fillna(0)
    df["data_vencimento"] = pd.to_datetime(df["data_vencimento"])
    df["dias_para_vencer"] = (df["data_vencimento"] - pd.Timestamp.now().normalize()).dt.days

    # --- FILTROS ---
    st.sidebar.subheader("Filtros")
    filtro = st.sidebar.selectbox("Visualizar", ["Todos", "Baixo estoque", "Próximo do vencimento", "Vencidos"])

    if filtro == "Baixo estoque":
        df_filtrada = df[df["percentual_estoque"] <= 30].copy()
    elif filtro == "Próximo do vencimento":
        df_filtrada = df[df["dias_para_vencer"] <= 60].copy()
    elif filtro == "Vencidos":
        df_filtrada = df[df["dias_para_vencer"] < 0].copy()
    else:
        df_filtrada = df.copy()

    # --- VISÃO GERAL ---
    st.subheader("📊 Visão Geral")
    col1, col2, col3, col4 = st.columns(4)
    with col1:
        st.metric("Remédios", len(df_filtrada))
    with col2:
        st.metric("Estoque atual", int(df_filtrada["qtd_atual"].sum()))
    with col3:
        st.metric("Baixo estoque", int((df_filtrada["percentual_estoque"] <= 30).sum()))
    with col4:
        st.metric("Vencem em 60 dias", int((df_filtrada["dias_para_vencer"] <= 60).sum()))

    st.subheader("📈 Estoque por remédio")
    st.bar_chart(df_filtrada.set_index("nome")[["qtd_atual", "qtd_total"]], use_container_width=True)

    st.subheader("⏳ Validade dos remédios")
    validade_df = df_filtrada[["nome", "dias_para_vencer"]].copy().sort_values("dias_para_vencer")
    st.bar_chart(validade_df.set_index("nome"), use_container_width=True)

    st.subheader("📋 Detalhes do Estoque")
    st.dataframe(
        df_filtrada[["nome", "qtd_atual", "qtd_total", "percentual_estoque", "data_vencimento", "dias_para_vencer"]]
        .rename(columns={
            "nome": "Remédio",
            "qtd_atual": "Qtde atual",
            "qtd_total": "Qtde total",
            "percentual_estoque": "% estoque",
            "data_vencimento": "Validade",
            "dias_para_vencer": "Dias para vencer"
        })
        .style.format({"Validade": lambda x: x.strftime("%d/%m/%Y"), "% estoque": "{:.1f}"}),
        use_container_width=True
    )

    st.markdown("<div class='premium-card'>", unsafe_allow_html=True)
    st.markdown("</div>", unsafe_allow_html=True)

    # --- CHECAGEM DE ALERTAS ---
    st.subheader("⚠️ Alertas e Avisos")
    alertas_estoque = []
    alertas_validade = []

    hoje = datetime.now().date()
    limite_vencimento = hoje + timedelta(days=60) # 2 meses (60 dias)

    for r in remedios:
        r_id, r_nome, r_atual, r_total, r_venc = r
        venc_date = datetime.strptime(r_venc, "%Y-%m-%d").date()

        # Alerta de estoque <= 30%
        porcentagem = (r_atual / r_total) * 100
        if porcentagem <= 30:
            alertas_estoque.append(f"**{r_nome}**: restam apenas {r_atual} de {r_total} ({porcentagem:.1f}%)")

        # Alerta de vencimento <= 60 dias
        if venc_date <= limite_vencimento:
            dias_restantes = (venc_date - hoje).days
            if dias_restantes < 0:
                alertas_validade.append(f"**{r_nome}**: 🚨 VENCIDO em {venc_date.strftime('%d/%m/%Y')}")
            else:
                alertas_validade.append(f"**{r_nome}**: vence em {dias_restantes} dias ({venc_date.strftime('%d/%m/%Y')})")

    col_a, col_b = st.columns(2)
    with col_a:
        if alertas_estoque:
            for alert in alertas_estoque:
                st.warning(f"📉 **Estoque Baixo:** {alert}")
        else:
            st.success("✅ Todos os estoques estão normais.")

    with col_b:
        if alertas_validade:
            for alert in alertas_validade:
                st.error(f"⏳ **Atenção à Validade:** {alert}")
        else:
            st.success("✅ Nenhum remédio próximo do vencimento.")

    # --- LISTAGEM E GERENCIAMENTO ---
    st.subheader("📋 Remédios Cadastrados")
    for r in df_filtrada.itertuples(index=False):
        r_id, r_nome, r_atual, r_total, r_venc, r_pct, _, r_dias = r
        venc_br = pd.to_datetime(r_venc).strftime("%d/%m/%Y")

        if r_pct <= 30:
            status = "status-alert"
            status_label = "Baixo estoque"
        elif r_dias <= 60:
            status = "status-danger"
            status_label = "Vence em breve"
        else:
            status = "status-ok"
            status_label = "Em dia"

        with st.container():
            st.markdown(
                f"""
                <div class="premium-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap: wrap;">
                        <div>
                            <div style="font-size:1.15rem; font-weight:700; color: #edf5ff;">{r_nome}</div>
                            <div style="font-size:0.9rem; color: #a7b7cf; margin-top: 0.25rem;">Qtd: {r_atual}/{r_total} · Validade: {venc_br}</div>
                        </div>
                        <span class="status-badge {status}">{status_label}</span>
                    </div>
                </div>
                """,
                unsafe_allow_html=True,
            )

            c1, c2, c3, c4 = st.columns([2.1, 2.1, 2.2, 1.2])
            nova_qtd = c1.number_input(f"Nova Qtd · {r_nome}", min_value=0, value=r_atual, key=f"qtd_{r_id}")
            if nova_qtd != r_atual:
                conn = sqlite3.connect(DB_NAME)
                c = conn.cursor()
                c.execute('UPDATE remedios SET qtd_atual = ? WHERE id = ?', (nova_qtd, r_id))
                conn.commit()
                conn.close()
                st.rerun()

            if c3.button("🗑️ Excluir", key=f"del_{r_id}"):
                conn = sqlite3.connect(DB_NAME)
                c = conn.cursor()
                c.execute('DELETE FROM remedios WHERE id = ?', (r_id,))
                conn.commit()
                conn.close()
                st.rerun()

            c2.write(f"Estoque: {r_pct:.0f}%")
            c4.write(f"{r_dias} dias")

